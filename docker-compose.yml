services:
  app:
    build:
      context: .
      network: host
    container_name: wps-backend
    network_mode: host
    env_file: .env
    environment:
      # Override Windows paths from .env inside the Linux container.
      UPDATES_DIR: /app/storage/wps_updates
    volumes:
      - ./storage:/app/storage
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT:-5002}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

